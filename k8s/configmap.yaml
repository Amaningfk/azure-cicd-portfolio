apiVersion: v1
kind: ConfigMap
metadata:
  name: site-nginx-conf
  namespace: portfolio
  labels:
    app.kubernetes.io/name: portfolio-site
    app.kubernetes.io/part-of: azure-cicd-portfolio
data:
  default.conf: |
    server {
      listen       8080;
      server_name  _;
      root         /usr/share/nginx/html;
      index        index.html;

      # Hashed assets can be cached hard; the page itself must always be revalidated.
      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
      }

      location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
