name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/stage-quality.yml

  build:
    name: Build
    needs: quality
    uses: ./.github/workflows/stage-build.yml

  verify:
    name: Verify
    needs: build
    uses: ./.github/workflows/stage-verify.yml

  ci-complete:
    name: CI complete
    if: always()
    needs: [quality, build, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage to have succeeded
        run: |
          echo 'results: ${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled|skipped)"'; then
            echo 'A required stage did not succeed.'; exit 1
          fi
          echo 'Every stage passed.'
